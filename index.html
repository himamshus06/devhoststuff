<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">ಕಲಾ ಸೇತು</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <script src="config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D97706">
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-container">
      <h1 id="app-brand-name">ಕಲಾ ಸೇತು</h1>
      <span id="app-tagline" class="tagline">ಕರಾವಳಿ ಕರಕುಶಲ ಮಾರುಕಟ್ಟೆ</span>
    </div>
    <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLanguage()">
      English
    </button>
  </header>

  <!-- Main Container -->
  <main id="main-container">
    
    <!-- HOME SCREEN: 3 Big Buttons -->
    <section id="screen-home" class="screen active">
      <div class="welcome-banner">
        <h2 data-i18n="welcomeMsg"></h2>
        <p data-i18n="welcomeSub"></p>
      </div>

      <div class="big-button-grid">
        <button class="big-btn primary-action" onclick="switchScreen('screen-add-product')">
          <span class="icon">📸</span>
          <span data-i18n="btnAddProduct"></span>
          <span class="btn-sub" data-i18n="btnAddSub"></span>
        </button>

        <button class="big-btn" onclick="switchScreen('screen-orders')">
          <span class="icon">📦</span>
          <span data-i18n="btnMyOrders"></span>
          <span class="btn-sub" data-i18n="btnOrdersSub"></span>
        </button>

        <button class="big-btn" onclick="switchScreen('screen-shop')">
          <span class="icon">🛍️</span>
          <span data-i18n="btnMyShop"></span>
          <span class="btn-sub" data-i18n="btnShopSub"></span>
        </button>
      </div>
    </section>

    <!-- SCREEN 1: ADD PRODUCT -->
    <!-- SCREEN 1: ADD PRODUCT -->
<!-- SCREEN 1: ADD PRODUCT (WITH DUAL MODE CHOICE) -->

<!-- SCREEN 1: ADD PRODUCT -->
<section id="screen-add-product" class="screen">
  <div class="screen-header-bar">
    <button class="back-btn" onclick="handleBackAction()">← <span data-i18n="back"></span></button>
    <h2 id="add-product-screen-title" data-i18n="addTitle"></h2>
  </div>

  <!-- MODE SELECTION CARDS -->
  <div id="listing-mode-chooser" class="form-card">
    <h3 data-i18n="chooserHeader" style="margin-bottom: 1rem; text-align: center;">ನೀವು ಹೇಗೆ ಪಟ್ಟಿ ಮಾಡಲು ಬಯಸುತ್ತೀರಿ?</h3>
    <div class="chooser-grid">
      <button type="button" class="mode-card-btn" onclick="selectListingMode('ai')">
        <span class="icon">🎙️</span>
        <strong data-i18n="modeAiTitle">AI ಧ್ವನಿ / ವಿವರಣೆ</strong>
        <span data-i18n="modeAiSub">ಮಾತನಾಡಿ ಅಥವಾ ಬರೆಯಿರಿ (AI ಆಟೋಫಿಲ್)</span>
      </button>

      <button type="button" class="mode-card-btn" onclick="selectListingMode('manual')">
        <span class="icon">✍️</span>
        <strong data-i18n="modeManualTitle">ಹಂತ-ಹಂತದ ಮಾಂತ್ರಿಕ (Wizard)</strong>
        <span data-i18n="modeManualSub">ಒಂದೊಂದೇ ವಿವರವಾಗಿ ನೀಡಿ</span>
      </button>
    </div>
  </div>

  <!-- OPTION 1: MANUAL WIZARD -->
  <div id="manual-wizard-container" class="form-card" style="display: none;">
    <div class="wizard-progress-bar">
      <span id="wizard-step-indicator"></span>
    </div>

    <!-- Step 1: Photo & Name -->
    <div class="wizard-step" data-step="1">
      <div class="input-group">
        <label data-i18n="photoLabel"></label>
        <div class="photo-instructions">
          <small data-i18n="photoGuide">📸 ಗರಿಷ್ಠ 5 ಫೋಟೋಗಳು: ಮುಂಭಾಗ, ಮೇಲ್ಭಾಗ, ಪಕ್ಕದ ನೋಟ, ಇತರ 2 ಚಿತ್ರಗಳು</small>
        </div>
        <div class="upload-box" onclick="triggerPhotoUpload()">
          <span>📷</span>
          <span data-i18n="uploadPrompt"></span>
          <input type="file" id="manual-photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event, 'manual')">
        </div>
        <div id="manual-gallery-preview" class="photo-gallery-preview"></div>
      </div>
      <div class="input-group">
        <label data-i18n="fieldTitle"></label>
        <input type="text" id="manual-title" placeholder="ಉದಾ: ಕಾಸುತಿ ಸೀರೆ">
      </div>
      <div class="input-group">
        <label data-i18n="fieldPrice"></label>
        <input type="number" id="manual-price" placeholder="₹">
      </div>
    </div>

    <!-- Step 2: Specs & Quantity -->
    <div class="wizard-step" data-step="2" style="display: none;">
      <div class="input-group">
        <label data-i18n="fieldStory"></label>
        <textarea id="manual-story" rows="2" placeholder="ಸಂಕ್ಷಿಪ್ತ ವಿವರಣೆ ನೀಡಿ..."></textarea>
      </div>
      <div class="field-grid-2">
        <div class="input-group">
          <label data-i18n="fieldMaterial"></label>
          <input type="text" id="manual-material" placeholder="ಹತ್ತಿ / Silk">
        </div>
        <div class="input-group">
          <label data-i18n="fieldQuantity"></label>
          <input type="number" id="manual-quantity" value="1" min="1">
        </div>
      </div>
      <div class="field-grid-2">
        <div class="input-group">
          <label data-i18n="fieldDimensions"></label>
          <input type="text" id="manual-dimensions" placeholder="6.3m">
        </div>
        <div class="input-group">
          <label data-i18n="fieldWeight"></label>
          <input type="text" id="manual-weight" placeholder="500g">
        </div>
      </div>
    </div>

    <!-- Step 3: Address -->
    <div class="wizard-step" data-step="3" style="display: none;">
      <div class="input-group">
        <label data-i18n="fieldAddress"></label>
        <textarea id="manual-address" rows="3" placeholder="ಊರು, ಜಿಲ್ಲೆ, ಪಿನ್‌ಕೋಡ್"></textarea>
        <small class="privacy-note" data-i18n="addressPrivacyNote"></small>
      </div>
    </div>

    <!-- Wizard Nav Buttons -->
    <div class="wizard-nav-buttons">
      <button type="button" id="wizard-prev-btn" class="secondary-btn" onclick="changeWizardStep(-1)" style="display:none;" data-i18n="btnBack">ಹಿಂದಕ್ಕೆ</button>
      <button type="button" id="wizard-next-btn" class="publish-btn" onclick="changeWizardStep(1)" data-i18n="btnNext">ಮುಂದಕ್ಕೆ</button>
    </div>
  </div>

  <!-- OPTION 2: AI VOICE/PARAGRAPH MODE -->
  <div id="ai-wizard-container" class="form-card" style="display: none;">
    <div id="ai-input-stage">
      <div class="input-group">
        <label data-i18n="photoLabel"></label>
        <div class="photo-instructions">
          <small data-i18n="photoGuide">📸 Max 5 photos: Front view, Top view, Side view, + 2 detail photos</small>
        </div>
        <div class="upload-box" onclick="triggerPhotoUpload()">
          <span>📷</span>
          <span data-i18n="uploadPrompt"></span>
          <input type="file" id="ai-photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event, 'ai')">
        </div>
        <div id="ai-gallery-preview" class="photo-gallery-preview"></div>
      </div>

      <div class="input-group">
        <label data-i18n="voiceSectionLabel"></label>
        <div class="voice-input-wrapper">
          <textarea id="artisan-voice-input" rows="3" data-i18n-ph="descPlaceholder"></textarea>
          <button type="button" id="mic-btn" class="mic-btn" onclick="toggleSpeechRecognition()">
            🎙️ <span data-i18n="micBtn"></span>
          </button>
        </div>
        <small id="speech-status" class="speech-status-text"></small>
      </div>

      <button type="button" class="ai-action-btn" onclick="processAiExtraction()">
        ✨ <span data-i18n="aiGenerateBtn"></span>
      </button>
    </div>

    <!-- AI Extracted Form Stage -->
    <div id="ai-review-stage" style="display: none;" class="ai-results-box">
      <h3 data-i18n="reviewHeader">🤖 AI ಪರಿಶೀಲನಾ ಮಾಂತ್ರಿಕ</h3>
      
      <div class="field-row">
        <label data-i18n="fieldTitle"></label>
        <input type="text" id="res-title">
      </div>
      <div class="field-row">
        <label data-i18n="fieldStory"></label>
        <textarea id="res-story" rows="2"></textarea>
      </div>
      <div class="field-grid-2">
        <div class="field-row">
          <label data-i18n="fieldPrice"></label>
          <input type="number" id="res-price">
        </div>
        <div class="field-row">
          <label data-i18n="fieldQuantity"></label>
          <input type="number" id="res-quantity">
        </div>
      </div>
      <div class="field-row">
        <label data-i18n="fieldMaterial"></label>
        <input type="text" id="res-material">
      </div>
      <div class="field-grid-2">
        <div class="field-row">
          <label data-i18n="fieldDimensions"></label>
          <input type="text" id="res-dimensions">
        </div>
        <div class="field-row">
          <label data-i18n="fieldWeight"></label>
          <input type="text" id="res-weight">
        </div>
      </div>
      <div class="field-row">
        <label data-i18n="fieldAddress"></label>
        <textarea id="res-address" rows="2"></textarea>
      </div>

      <button type="button" class="publish-btn" onclick="openFinalPreview('ai')">
        👁️ <span data-i18n="btnPreview">ಪೂರ್ವವೀಕ್ಷಣೆ (Preview)</span>
      </button>
    </div>
  </div>

  <!-- FINAL PREVIEW & CONFIRMATION MODAL -->
  <div id="preview-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3 data-i18n="previewTitle">🔍 ಅಂತಿಮ ಪಟ್ಟಿ ಪರಿಶೀಲನೆ (Final Confirmation)</h3>
      <div id="preview-photos-gallery" class="photo-gallery-preview"></div>
      
      <div id="preview-details-list" class="preview-details-card">
        <!-- Injected dynamically -->
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" onclick="closePreviewModal()" data-i18n="btnEdit">✏️ ಬದಲಾಯಿಸಿ (Edit)</button>
        <button type="button" class="publish-btn" onclick="confirmAndPublish()" data-i18n="btnConfirmPublish">🚀 ಖಚಿತಪಡಿಸಿ ಮತ್ತು ಪ್ರಕಟಿಸಿ</button>
      </div>
    </div>
  </div>
</section>

<!-- SCREEN 3: MY SHOP -->
<section id="screen-shop" class="screen">
  <div class="screen-header-bar">
    <button class="back-btn" onclick="switchScreen('screen-home')">← <span data-i18n="back"></span></button>
    <h2 data-i18n="shopTitle"></h2>
  </div>
  
  <div class="shop-stats">
    <div class="stat-box">
      <span id="stat-active-count" class="stat-num">0</span>
      <span class="stat-label" data-i18n="statActive"></span>
    </div>
    <div class="stat-box">
      <span id="stat-earnings-count" class="stat-num">₹ 0</span>
      <span class="stat-label" data-i18n="statEarnings"></span>
    </div>
  </div>

  <div id="shop-products-list" class="product-mini-list">
    <div id="no-products-msg" class="empty-state">
      <p data-i18n="noProducts"></p>
    </div>
  </div>
</section>

    <!-- SCREEN 2: MY ORDERS -->
    <section id="screen-orders" class="screen">
      <div class="screen-header-bar">
        <button class="back-btn" onclick="switchScreen('screen-home')">← <span data-i18n="back"></span></button>
        <h2 data-i18n="ordersTitle"></h2>
      </div>
      
      <div id="orders-list-container" class="orders-list">
        <!-- Dynamic order cards will be appended here. Default empty state: -->
        <div id="no-orders-msg" class="empty-state">
          <p data-i18n="noOrders"></p>
        </div>
      </div>
    </section>

    <!-- SCREEN 3: MY SHOP -->
    <section id="screen-shop" class="screen">
      <div class="screen-header-bar">
        <button class="back-btn" onclick="switchScreen('screen-home')">← <span data-i18n="back"></span></button>
        <h2 data-i18n="shopTitle"></h2>
      </div>
      
      <div class="shop-stats">
        <div class="stat-box">
          <span id="stat-active-count" class="stat-num">0</span>
          <span class="stat-label" data-i18n="statActive"></span>
        </div>
        <div class="stat-box">
          <span id="stat-earnings-count" class="stat-num">₹ 0</span>
          <span class="stat-label" data-i18n="statEarnings"></span>
        </div>
      </div>

      <div id="shop-products-list" class="product-mini-list">
        <div id="no-products-msg" class="empty-state">
          <p data-i18n="noProducts"></p>
        </div>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
